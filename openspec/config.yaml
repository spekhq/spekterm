schema: spec-driven

context: |
  Project: spek workspace — agent 開發工作台（Electron 桌面 app，私有、專有授權）
  Purpose: 把多個「一個 repo／資料夾各自一個 claude session」的 terminal 包在一個殼裡，
           並加上一塊懂 OpenSpec 結構的側欄
  Tech stack（已安裝）: Electron 43.1.0（釘死）, electron-vite, TypeScript,
           React 19, Tailwind CSS v4, react-resizable-panels, chokidar 5（主行程檔案監控）,
           node-pty 1.2.0-beta.14（釘死）, @spekjs/core（npm 公開套件，主行程直接 import）,
           monaco-editor（編輯器，只含語法高亮，不含任何 language/* 語言服務 worker）,
           react-markdown + remark-gfm（markdown 檢視，與 spek 的 web 同版）,
           @xterm/xterm 6 + addon-fit + addon-web-links（terminal UI，封裝於單一 wrapper 模組）
  Tech stack（規劃中）: electron-builder（打包, Phase 6）
  Authority: docs/PRD.md 是產品需求的單一權威來源；
             docs/workspace-mockup.html 是 UI 行為的權威雛型
  Status: Phase 0–3 已封存（app 骨架、多 folder 工作區、File Explorer 與唯讀檢視、
          編輯能力與完整 CRUD）；
          Phase 4「Terminal（agent 主場）」實作完成待封存（node-pty 多 session 管理、
          IPC 雙向串流、xterm + fit、session 分頁 + rail 的 repo→session 子列、
          spawn 目標可選 claude／login shell、cwd = 選中 folder、生命週期不留孤兒行程）
  Verification: 驗收走 scripts/probe-*.mjs（以 CDP 連進真正執行中的 app）與 npm test
                （node:test 單元測試）。不在產品程式碼裡塞測試分支，也不為驗收而在
                產品 UI 上掛 data-* 屬性。
  Conventions: 程式碼英文，註解與文件繁體中文（台灣用語）
